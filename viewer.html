<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Target GEO Viewer</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: operator tool — account picker + campaign rail on the left, map or table on the right; stacks on phones */
:root {
  --bg: #f3f5f7; --panel: #ffffff; --ink: #17202b; --muted: #5b6776; --line: #d9dfe6;
  --mapbg: #e8ecf0; --target: #0f6f73; --target-fill: #14898e; --exclude: #b3372b; --radius: #6447b8;
  --warn-bg: #fff3df; --warn-ink: #8a4b00; --chip: #eef2f5; --sel: #e3f1f1; --tiles: none;
  --font-ui: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11161c; --panel: #171e26; --ink: #e6ebf0; --muted: #98a4b2; --line: #2a3440;
    --mapbg: #0d1217; --target: #5fc4c6; --target-fill: #3aa8ab; --exclude: #ef7a6c; --radius: #b39ef2;
    --warn-bg: #3a2a12; --warn-ink: #f3c07a; --chip: #212a34; --sel: #183436;
    --tiles: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; }
.app { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; grid-template-rows: 100%; height: 100%; overflow: hidden; }
.rail { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; min-width: 0; }
.rail header { padding: 16px 18px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-size: 19px; margin: 0; font-weight: 700; text-wrap: balance; }
.meta { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
#acctInput { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); }
#acctInput:focus-visible { outline: 2px solid var(--target); outline-offset: 0; }
.group { border-bottom: 1px solid var(--line); }
.group h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; padding: 14px 18px 6px; font-weight: 600; }
.camp { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 6px; width: 100%; padding: 10px 18px; border-left: 3px solid transparent; }
.camp:hover { background: var(--chip); }
.camp:focus-visible { outline: 2px solid var(--target); outline-offset: -2px; }
.camp[aria-pressed="true"] { background: var(--sel); border-left-color: var(--target); }
.camp .nm { font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.camp .sub { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-family: var(--font-data); font-size: 11px; background: var(--chip); border-radius: 3px; padding: 2px 6px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.warn { background: var(--warn-bg); color: var(--warn-ink); font-weight: 500; }
.main { position: relative; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
.topbar .title { font-weight: 700; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.tabs button { all: unset; cursor: pointer; padding: 4px 12px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--sel); color: var(--ink); }
.tabs button:focus-visible { outline: 2px solid var(--target); outline-offset: -2px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-left: auto; }
.legend span, .legend label { display: inline-flex; align-items: center; gap: 6px; }
.legend label { cursor: pointer; }
.legend input { margin: 0; accent-color: var(--radius); }
.sw { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
.sw.t { background: var(--target-fill); opacity: .55; border: 1.5px solid var(--target); }
.sw.x { border: 1.5px dashed var(--exclude); }
.sw.r { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--radius); }
#map { flex: 1; background: var(--mapbg); }
.leaflet-container { background: var(--mapbg); font-family: var(--font-ui); }
.leaflet-tile-pane { filter: var(--tiles); }
.leaflet-tooltip { font-family: var(--font-ui); background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
.leaflet-bar a { background: var(--panel); color: var(--ink); border-bottom-color: var(--line); }
.leaflet-control-attribution { font-size: 10px; }
.detail { position: absolute; right: 12px; bottom: 12px; width: min(340px, calc(100% - 24px)); max-height: calc(100% - 80px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.12); z-index: 500; }
.detail header { padding: 12px 14px 8px; display: grid; gap: 4px; border-bottom: 1px solid var(--line); }
.detail .sec { padding: 10px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.detail .sec:last-child { border-bottom: 0; }
.detail h3 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 600; display: flex; justify-content: space-between; }
.detail h3 b { font-family: var(--font-data); font-weight: 500; }
.names { font-size: 12.5px; line-height: 1.55; }
.names .off { color: var(--muted); }
.flag { background: var(--warn-bg); color: var(--warn-ink); padding: 10px 14px; font-size: 12.5px; line-height: 1.45; display: grid; gap: 2px; }
.flag strong { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
.note { font-size: 12px; color: var(--muted); line-height: 1.45; }
.tablewrap { flex: 1; overflow: auto; padding: 14px 18px; display: grid; gap: 10px; align-content: start; }
#tableFilter { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); max-width: 360px; width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 13px; background: var(--panel); }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); position: sticky; top: 0; background: var(--panel); }
td.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
tr.ex td { color: var(--exclude); }
.status { position: absolute; inset: 0; display: grid; place-items: center; z-index: 600; pointer-events: none; }
.status span { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; font-size: 13px; color: var(--muted); box-shadow: 0 4px 16px rgba(0,0,0,.1); }
.empty { padding: 18px; color: var(--muted); line-height: 1.5; }
.gate { position: fixed; inset: 0; z-index: 2000; background: var(--bg); display: grid; place-items: center; padding: 16px; }
.gate form { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 24px; display: grid; gap: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
.gate h1 { font-size: 20px; }
.gate p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
.gate input { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); }
.gate input:focus-visible, .gate button:focus-visible { outline: 2px solid var(--target); outline-offset: 1px; }
.gate button { font: inherit; font-weight: 600; padding: 9px 12px; border: 0; border-radius: 4px; background: var(--target); color: var(--panel); cursor: pointer; }
.gate button:disabled { opacity: .6; cursor: default; }
.gate .err { color: var(--exclude); font-size: 13px; min-height: 1.2em; }
.signout { all: unset; cursor: pointer; font-size: 12px; color: var(--muted); text-decoration: underline; justify-self: start; }
.signout:focus-visible { outline: 2px solid var(--target); }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; overflow: visible; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); max-height: 50vh; }
  .main { min-height: 75vh; }
  #map { min-height: 60vh; }
  .detail { position: static; width: auto; max-height: none; border-radius: 0; box-shadow: none; border-width: 1px 0 0; }
  .legend { margin-left: 0; }
}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form id="loginForm" autocomplete="on">
    <span class="eyebrow">Strong Automotive</span>
    <h1>Target GEO Viewer</h1>
    <p>Enter the team password to view campaign location targeting.</p>
    <label for="pw" class="eyebrow" style="letter-spacing:.04em">Password</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <div class="err" id="loginErr" role="alert"></div>
    <button type="submit" id="loginBtn">Sign in</button>
  </form>
</div>
<div class="app">
  <aside class="rail" aria-label="Account and campaigns">
    <header>
      <span class="eyebrow">Target GEO Viewer</span>
      <label for="acctInput" class="eyebrow" style="letter-spacing:.04em">Account</label>
      <input id="acctInput" list="acctList" placeholder="Loading accounts…" autocomplete="off">
      <datalist id="acctList"></datalist>
      <h1 id="acctName">Pick an account</h1>
      <span class="meta" id="acctMeta"></span>
      <button class="signout" id="signOut" type="button">Sign out</button>
    </header>
    <div id="groups"><div class="empty">Type a store name or Google Ads ID above to see its active campaigns.</div></div>
  </aside>
  <section class="main">
    <div class="topbar">
      <div class="title" id="viewTitle">No account selected</div>
      <div class="tabs" role="tablist">
        <button id="tabMap" role="tab" aria-selected="true">Map</button>
        <button id="tabTable" role="tab" aria-selected="false">Table</button>
      </div>
      <div class="legend" id="legend">
        <span><i class="sw t"></i>Targeted</span>
        <span><i class="sw x"></i>Excluded</span>
        <label for="showRad"><input type="checkbox" id="showRad" checked><i class="sw r"></i>Radius</label>
      </div>
    </div>
    <div id="mapView" style="flex:1;display:flex;flex-direction:column;position:relative;min-height:0">
      <div id="map" role="region" aria-label="Map of targeted locations"></div>
      <div class="detail" id="detail" hidden></div>
    </div>
    <div class="tablewrap" id="tableView" hidden>
      <input id="tableFilter" placeholder="Filter by campaign, location or type">
      <div style="overflow-x:auto"><table><thead><tr><th>Campaign</th><th>Location</th><th>Type</th><th>Targeted / excluded</th><th>Radius</th></tr></thead><tbody id="tbody"></tbody></table></div>
    </div>
    <div class="status" id="status" hidden><span id="statusText">Loading…</span></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const CHANNEL = { SEARCH: 'Search', PERFORMANCE_MAX: 'Performance Max', SHOPPING: 'Shopping', DISPLAY: 'Display',
  VIDEO: 'Video', DEMAND_GEN: 'Demand Gen', DISCOVERY: 'Demand Gen', LOCAL: 'Local', SMART: 'Smart', HOTEL: 'Hotel' };
const SHAPE_TYPES = { 'City': 1, 'County': 1, 'Postal Code': 1, 'State': 1 };
const ORDER = ['Country', 'State', 'DMA Region', 'County', 'City', 'Municipality', 'Neighborhood', 'University', 'Airport', 'Postal Code'];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = id => document.getElementById(id);

let accounts = [], account = null, campaigns = [], shapes = {}, selected = null, view = 'map';

// ---------- server calls ----------
// ---------- sign-in ----------
let token = '';
try { token = localStorage.getItem('tgv-token') || ''; } catch (e) {}
const saveToken = t => { token = t; try { t ? localStorage.setItem('tgv-token', t) : localStorage.removeItem('tgv-token'); } catch (e) {} };
// API_URL: the Apps Script web app's /exec link. Requests go out without
// Google cookies, so being signed into several Google accounts doesn't matter.
const API_URL = 'https://script.google.com/macros/s/AKfycbwJNr_Vc9rzyAiQso3Nrbo1XlfutYhtM538GZmcUEQn6quwwggo8Df3bEdB7KauRAo-/exec';
const ARGS = { login: ['password'], getAccounts: [], getAccount: ['customerId'], getShapes: ['targets'] };
const rawCall = (fn, ...args) => {
  const body = { action: fn };
  if (fn === 'login') body.password = args[0];
  else { body.token = args[0]; ARGS[fn].forEach((k, i) => body[k] = args[i + 1]); }
  return fetch(API_URL, { method: 'POST', credentials: 'omit', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(r => { if (!r.ok) throw new Error('The data service answered ' + r.status + '.'); return r.json(); })
    .then(j => { if (!j.ok) throw new Error(j.error); return j.result; });
};
// Every data request carries the token; an expired or missing one brings back the sign-in screen.
const call = (fn, ...args) => rawCall(fn, token, ...args).catch(err => {
  if (/AUTH:/.test(err && err.message || err)) { showGate(); return new Promise(() => {}); }
  throw err;
});
function showGate(msg) {
  saveToken(''); busy('');
  $('gate').hidden = false; $('loginErr').textContent = msg || '';
  $('pw').value = ''; setTimeout(() => $('pw').focus(), 0);
}
$('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  $('loginBtn').disabled = true; $('loginErr').textContent = '';
  rawCall('login', $('pw').value).then(t => {
    saveToken(t); $('gate').hidden = true; $('pw').value = '';
    loadAccounts();
  }).catch(err => {
    $('loginErr').textContent = String(err && err.message || err).replace(/^Error:\s*/, '');
  }).finally(() => { $('loginBtn').disabled = false; });
});
$('signOut').addEventListener('click', () => showGate('Signed out.'));
const busy = msg => { $('status').hidden = !msg; if (msg) $('statusText').textContent = msg; };

// ---------- map ----------
const map = L.map('map', { zoomSnap: 0.25 }).setView([39.5, -96], 4);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · boundaries: US Census TIGER' }).addTo(map);
L.control.scale({ imperial: true, metric: false, position: 'bottomleft' }).addTo(map);
const layers = { geo: L.layerGroup().addTo(map), radius: L.layerGroup().addTo(map) };

// ---------- accounts ----------
function loadAccounts() {
  call('getAccounts').then(list => {
    accounts = list.sort((a, b) => a.name.localeCompare(b.name));
    $('acctList').innerHTML = accounts.map(a => `<option value="${esc(a.name)} · ${fmtId(a.id)}"></option>`).join('');
    $('acctInput').placeholder = `Search ${accounts.length} accounts`;
    let start = (new URLSearchParams(location.search).get('account') || '').replace(/\D/g, '');
    if (!start) { try { start = localStorage.getItem('tgv-account') || ''; } catch (e) {} }
    if (start && accounts.some(a => a.id === start)) openAccount(start);
  }).catch(err => { $('acctInput').placeholder = 'Could not load accounts'; showError(err); });
}
const fmtId = id => String(id).replace(/^(\d{3})(\d{3})(\d{4})$/, '$1-$2-$3');
$('acctInput').addEventListener('change', e => {
  const v = e.target.value.trim(), digits = v.replace(/\D/g, '');
  const hit = accounts.find(a => v === `${a.name} · ${fmtId(a.id)}` || (digits.length === 10 && a.id === digits))
    || accounts.find(a => a.name.toLowerCase() === v.toLowerCase());
  if (hit && !(account && account.id === hit.id)) openAccount(hit.id);
});

function openAccount(id) {
  busy('Loading targeting…');
  call('getAccount', id).then(data => {
    account = data;
    try { localStorage.setItem('tgv-account', id); } catch (e) {}
    $('acctInput').value = `${data.name} · ${fmtId(data.id)}`;
    $('acctName').textContent = data.name;
    buildCampaigns(data.rows);
    $('acctMeta').textContent = `${fmtId(data.id)} · ${campaigns.length} active campaigns · exported ${data.date}`;
    renderRail();
    select('all');
    const need = {}; data.rows.forEach(r => { if (r.kind === 'LOCATION' && SHAPE_TYPES[r.targetType]) need[r.geoId] = r; });
    const list = Object.values(need).map(r => ({ geoId: r.geoId, geoName: r.geoName, canonical: r.canonical, targetType: r.targetType, country: r.country }));
    if (!list.length) { busy(''); return; }
    busy(`Loading ${list.length} boundaries…`);
    return call('getShapes', list).then(s => { shapes = s; busy(''); draw(); });
  }).catch(err => { busy(''); showError(err); });
}

function buildCampaigns(rows) {
  const by = {};
  rows.forEach(r => {
    const c = by[r.campaignId] || (by[r.campaignId] = { id: r.campaignId, name: r.campaignName, type: CHANNEL[r.campaignType] || r.campaignType || 'Other',
      pos: [], neg: [], radius: [], broad: 0, noGeo: false });
    if (r.kind === 'RADIUS') c.radius.push(r);
    else if (r.kind === 'BROAD_EXCLUSIONS') c.broad += r.count || 0;
    else if (r.kind === 'NO_LOCATION_TARGETS') c.noGeo = true;
    else (r.excluded ? c.neg : c.pos).push(r);
  });
  campaigns = Object.values(by).sort((a, b) => a.type.localeCompare(b.type) || a.name.localeCompare(b.name));
  // Campaigns that share the exact same targeting
  const sig = c => c.pos.map(r => r.geoId).sort().join(',') + '|' + c.radius.map(r => `${r.lat},${r.lng},${r.radiusMi}`).sort().join(';');
  const counts = {}; campaigns.forEach(c => { c.sig = sig(c); counts[c.sig] = (counts[c.sig] || 0) + 1; });
  campaigns.forEach(c => c.twins = counts[c.sig] - 1);
}

// ---------- rail ----------
function renderRail() {
  const g = $('groups');
  if (!campaigns.length) { g.innerHTML = '<div class="empty">No active campaigns in this account.</div>'; return; }
  let h = `<div class="group"><button class="camp" data-id="all" aria-pressed="false"><span class="nm">All active campaigns</span>
    <span class="sub">Every location and radius any campaign targets</span></button></div>`;
  [...new Set(campaigns.map(c => c.type))].forEach(type => {
    const list = campaigns.filter(c => c.type === type);
    h += `<div class="group"><h2>${esc(type)} · ${list.length}</h2>`;
    list.forEach(c => {
      const zips = c.pos.filter(r => r.targetType === 'Postal Code').length;
      h += `<button class="camp" data-id="${esc(c.id)}" aria-pressed="false"><span class="nm">${esc(c.name)}</span>
        ${c.twins ? `<span class="sub">Same targeting as ${c.twins} other campaign${c.twins > 1 ? 's' : ''}</span>` : ''}
        <span class="chips"><span class="chip">${c.pos.length} loc</span>${c.radius.length ? `<span class="chip">${c.radius.length} radius</span>` : ''}
        ${zips ? '<span class="chip warn">ZIP targeting</span>' : ''}${c.noGeo ? '<span class="chip warn">No location targets</span>' : ''}</span></button>`;
    });
    h += '</div>';
  });
  g.innerHTML = h;
  g.querySelectorAll('.camp').forEach(b => b.addEventListener('click', () => select(b.dataset.id)));
}

function current() {
  if (selected !== 'all') return campaigns.find(c => c.id === selected);
  const seen = {}, rseen = {}, all = { id: 'all', name: 'All active campaigns', type: account.name, pos: [], neg: [], radius: [], broad: 0, noGeo: false };
  campaigns.forEach(c => {
    c.pos.forEach(r => { if (!seen[r.geoId]) { seen[r.geoId] = 1; all.pos.push(r); } });
    c.radius.forEach(r => { const k = `${r.lat},${r.lng},${r.radiusMi}`; if (!rseen[k]) { rseen[k] = 1; all.radius.push(r); } });
    if (c.noGeo) all.noGeo = true;
  });
  // In the overview, only show exclusions every campaign shares
  const geoCamps = campaigns.filter(c => c.pos.length || c.radius.length);
  const negSets = geoCamps.map(c => new Set(c.neg.map(r => r.geoId)));
  const negSeen = {};
  geoCamps.forEach(c => c.neg.forEach(r => { if (!negSeen[r.geoId] && negSets.every(s => s.has(r.geoId))) { negSeen[r.geoId] = 1; all.neg.push(r); } }));
  return all;
}

function select(id) {
  selected = id;
  document.querySelectorAll('.camp').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === id)));
  const c = current();
  $('viewTitle').textContent = c ? c.name : '';
  draw(); renderTable();
}

// ---------- drawing ----------
function draw() {
  layers.geo.clearLayers(); layers.radius.clearLayers();
  const c = account && current();
  if (!c) { $('detail').hidden = true; return; }
  const bounds = L.latLngBounds([]);
  const addGeo = (r, ex) => {
    const g = shapes[r.geoId]; if (!g) return;
    const zip = r.targetType === 'Postal Code';
    const lyr = L.geoJSON(g, { style: () => ex
      ? { color: css('--exclude'), weight: 2, dashArray: '5 4', fillColor: css('--exclude'), fillOpacity: .1 }
      : { color: css('--target'), weight: zip ? 1 : 1.5, fillColor: css('--target-fill'), fillOpacity: zip ? .25 : .35 } });
    lyr.bindTooltip(`<b>${esc(r.geoName)}</b><br>${esc(r.targetType)} · ${ex ? 'Excluded' : 'Targeted'}`, { sticky: true });
    layers.geo.addLayer(lyr);
    if (!ex) bounds.extend(lyr.getBounds());
  };
  c.neg.forEach(r => addGeo(r, true));
  c.pos.forEach(r => addGeo(r, false));
  const rc = css('--radius');
  c.radius.forEach(r => {
    if (r.lat == null) return;
    const m = r.radiusMi * 1609.344;
    const circ = L.circle([r.lat, r.lng], { radius: m, color: rc, weight: 1.5, fillColor: rc, fillOpacity: .08, dashArray: r.excluded ? '5 4' : null });
    circ.bindTooltip(`<b>${r.radiusMi} mi radius</b>${r.excluded ? ' · Excluded' : ''}<br>${r.lat.toFixed(4)}, ${r.lng.toFixed(4)}`, { sticky: true });
    layers.radius.addLayer(circ);
    layers.radius.addLayer(L.circleMarker([r.lat, r.lng], { radius: 2.5, weight: 0, fillColor: rc, fillOpacity: 1, interactive: false }));
    if (!r.excluded) bounds.extend(L.latLng(r.lat, r.lng).toBounds(m * 2));
  });
  if (bounds.isValid()) map.fitBounds(bounds, innerWidth > 760 ? { paddingTopLeft: [30, 30], paddingBottomRight: [370, 30], maxZoom: 12 } : { padding: [20, 20], maxZoom: 12 });
  renderDetail(c);
}

function renderDetail(c) {
  const byType = rows => rows.reduce((a, r) => { (a[r.targetType] = a[r.targetType] || []).push(r); return a; }, {});
  const pos = byType(c.pos), neg = byType(c.neg);
  const types = o => Object.keys(o).sort((a, b) => (ORDER.indexOf(a) + 99) % 99 - (ORDER.indexOf(b) + 99) % 99);
  const list = rows => rows.map(r => shapes[r.geoId] ? esc(r.geoName)
    : `<span class="off" title="No boundary shape available">${esc(r.geoName)}*</span>`).join(', ');
  const zips = (pos['Postal Code'] || []).length;
  const sizes = {}; c.radius.forEach(r => sizes[r.radiusMi] = (sizes[r.radiusMi] || 0) + 1);
  let h = `<header><span class="eyebrow">${esc(c.type)}</span><div style="font-weight:700;line-height:1.3;overflow-wrap:anywhere">${esc(c.name)}</div>
    <div class="chips"><span class="chip">${c.pos.length} locations</span><span class="chip">${c.radius.length} radius</span>
    <span class="chip">${c.neg.length + c.broad} exclusions</span>${zips ? `<span class="chip warn">${zips} ZIP targets</span>` : ''}</div></header>`;
  if (zips) h += `<div class="flag"><strong>HEC check</strong>Targets ${zips} ZIP code${zips > 1 ? 's' : ''}. Google's housing, employment and credit policy doesn't allow postal-code targeting for dealer accounts. Swap these for city, county or radius targets.</div>`;
  if (c.noGeo && c.id !== 'all') h += `<div class="flag"><strong>No location targets</strong>This campaign has no location or radius targets, so it can show ads in any country.</div>`;
  if (c.noGeo && c.id === 'all') h += `<div class="flag"><strong>No location targets</strong>At least one active campaign has no location or radius targets. Look for the tag in the list.</div>`;
  h += `<div class="sec"><h3>Targeted <b>${c.pos.length}</b></h3>`;
  types(pos).forEach(k => h += `<div class="names"><span class="eyebrow" style="font-size:10px">${esc(k)} · ${pos[k].length}</span><br>${list(pos[k])}</div>`);
  if (!c.pos.length) h += '<div class="note">None.</div>';
  h += `</div>`;
  if (c.radius.length) h += `<div class="sec"><h3>Radius <b>${c.radius.length}</b></h3><div class="chips">${Object.keys(sizes).map(Number).sort((a, b) => a - b)
    .map(k => `<span class="chip">${sizes[k]} × ${k} mi</span>`).join('')}</div></div>`;
  h += `<div class="sec"><h3>Excluded <b>${c.neg.length + c.broad}</b></h3>`;
  types(neg).forEach(k => h += `<div class="names"><span class="eyebrow" style="font-size:10px">${esc(k)} · ${neg[k].length}</span><br>${list(neg[k])}</div>`);
  if (c.broad) h += `<div class="note">Plus ${c.broad} country and state exclusions, not drawn.</div>`;
  if (c.id === 'all') h += `<div class="note">Shows exclusions every active campaign shares. Pick a campaign to see its own.</div>`;
  h += `</div><div class="sec"><div class="note">Names marked * have no public boundary shape (DMAs, neighborhoods, PO-box ZIPs, some unincorporated places), so they're listed but not drawn.</div></div>`;
  $('detail').innerHTML = h; $('detail').hidden = view !== 'map';
}

// ---------- table ----------
function renderTable() {
  if (!account) return;
  const q = $('tableFilter').value.trim().toLowerCase();
  const list = selected === 'all' ? campaigns : campaigns.filter(c => c.id === selected);
  const rows = [];
  list.forEach(c => {
    c.pos.concat(c.neg).forEach(r => rows.push([c.name, r.geoName, r.targetType, r.excluded, '']));
    c.radius.forEach(r => rows.push([c.name, `${r.lat}, ${r.lng}`, 'Radius', r.excluded, `${r.radiusMi} mi`]));
    if (c.broad) rows.push([c.name, `${c.broad} countries and states`, 'Summary', true, '']);
    if (c.noGeo) rows.push([c.name, 'No location targets', 'Summary', false, '']);
  });
  const shown = rows.filter(r => !q || r.join(' ').toLowerCase().includes(q));
  $('tbody').innerHTML = shown.map(r => `<tr class="${r[3] ? 'ex' : ''}"><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td>
    <td>${r[3] ? 'Excluded' : 'Targeted'}</td><td class="num">${esc(r[4])}</td></tr>`).join('')
    || '<tr><td colspan="5" class="note">No rows match.</td></tr>';
}
$('tableFilter').addEventListener('input', renderTable);

// ---------- view switching ----------
function setView(v) {
  view = v;
  $('tabMap').setAttribute('aria-selected', String(v === 'map'));
  $('tabTable').setAttribute('aria-selected', String(v === 'table'));
  $('mapView').hidden = v !== 'map'; $('mapView').style.display = v === 'map' ? 'flex' : 'none';
  $('tableView').hidden = v !== 'table';
  $('legend').style.visibility = v === 'map' ? 'visible' : 'hidden';
  if (v === 'map') { map.invalidateSize(); if (account) $('detail').hidden = false; }
}
$('tabMap').addEventListener('click', () => setView('map'));
$('tabTable').addEventListener('click', () => setView('table'));
$('showRad').addEventListener('change', e => e.target.checked ? map.addLayer(layers.radius) : map.removeLayer(layers.radius));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => draw());

function showError(err) {
  $('groups').innerHTML = `<div class="empty">Something went wrong: ${esc(err && err.message || err)}</div>`;
}

if (token) loadAccounts(); else showGate();
</script>
</body>
</html>
